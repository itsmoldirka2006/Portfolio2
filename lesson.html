<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luxury Beauty/title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fffafc;
            color: #29232a;
        }

        /* HEADER */

        header {
            background: #ffffff;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #9b4d78;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
        }

        nav a:hover {
            color: #9b4d78;
        }

        /* HERO */

        .hero {
            min-height: 650px;
            padding: 80px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            background: linear-gradient(135deg, #fff5f8, #f8edf3);
        }

        .hero-text {
            max-width: 600px;
        }

        .hero h1 {
            font-size: 58px;
            line-height: 1.1;
            margin-bottom: 25px;
        }

        .hero h1 span {
            color: #9b4d78;
        }

        .hero p {
            font-size: 19px;
            line-height: 1.7;
            margin-bottom: 30px;
            color: #5c555a;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            background: #9b4d78;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        .hero-image {
            width: 430px;
            height: 500px;
            border-radius: 220px 220px 20px 20px;
            object-fit: cover;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        /* SERVICES */

        .services {
            padding: 90px 8%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .section-title p {
            color: #777;
            font-size: 17px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.07);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-7px);
        }

        .icon {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .card h3 {
            font-size: 23px;
            margin-bottom: 15px;
            color: #9b4d78;
        }

        .card p {
            color: #666;
            line-height: 1.6;
        }

        .price {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
        }

        /* ABOUT */

        .about {
            padding: 90px 8%;
            background: #29232a;
            color: white;
            text-align: center;
        }

        .about h2 {
            font-size: 40px;
            margin-bottom: 25px;
        }

        .about p {
            max-width: 750px;
            margin: auto;
            line-height: 1.8;
            font-size: 18px;
            color: #ddd;
        }

        /* ADVANTAGES */

        .advantages {
            padding: 90px 8%;
        }

        .advantages-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .advantage {
            text-align: center;
            padding: 25px;
        }

        .advantage-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .advantage h3 {
            margin-bottom: 10px;
        }

        .advantage p {
            color: #777;
            line-height: 1.6;
        }

        /* CONTACT */

        .contact {
            padding: 90px 8%;
            background: #f8edf3;
            text-align: center;
        }

        .contact h2 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .contact p {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .contact .button {
            margin-top: 25px;
        }

        /* FOOTER */

        footer {
            padding: 25px;
            background: #1c181b;
            color: #aaa;
            text-align: center;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            header {
                padding: 18px 5%;
            }

            nav {
                display: none;
            }

            .hero {
                flex-direction: column;
                text-align: center;
                padding: 60px 5%;
            }

            .hero h1 {
                font-size: 42px;
            }

            .hero-image {
                width: 100%;
                max-width: 400px;
                height: 400px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .advantages-list {
                grid-template-columns: 1fr;
            }

            .services,
            .advantages,
            .contact {
                padding: 60px 5%;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            ✨ Luxury Beauty
        </div>

        <nav>
            <a href="#services">Услуги</a>
            <a href="#about">О нас</a>
            <a href="#contact">Контакты</a>
        </nav>

    </header>


    <!-- HERO -->

    <section class="hero">

        <div class="hero-text">

            <h1>
                Красота начинается
                <span>с заботы о себе</span>
            </h1>

            <p>
                Luxury Beauty — современный салон красоты,
                где профессиональные мастера помогают вам
                создать образ, в котором вы чувствуете себя
                уверенно.
            </p>

            <a href="#contact" class="button">
                Записаться
            </a>

        </div>


        <img
            class="hero-image"
            src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=800&q=80"
            alt="Салон красоты"
        >

    </section>


    <!-- SERVICES -->

    <section class="services" id="services">

        <div class="section-title">

            <h2>Наши услуги</h2>

            <p>
                Всё необходимое для вашего идеального образа
            </p>

        </div>


        <div class="cards">


            <div class="card">

                <div class="icon">💄</div>

                <h3>Макияж</h3>

                <p>
                    Профессиональный макияж
                    для повседневного образа
                    или особого мероприятия.
                </p>

                <div class="price">
                    15 000 ₸
                </div>

            </div>


            <div class="card">

                <div class="icon">💇</div>

                <h3>Укладка</h3>

                <p>
                    Создание стильной укладки
                    с учётом ваших пожеланий
                    и особенностей образа.
                </p>

                <div class="price">
                    12 000 ₸
                </div>

            </div>


            <div class="card">

                <div class="icon">✨</div>

                <h3>Брови и ресницы</h3>

                <p>
                    Оформление бровей и уход
                    за ресницами для выразительного
                    взгляда.
                </p>

                <div class="price">
                    8 000 ₸
                </div>

            </div>

        </div>

    </section>


    <!-- ABOUT -->

    <section class="about" id="about">

        <h2>О Luxury Beauty</h2>

        <p>
            Мы создаём пространство, где можно расслабиться,
            получить профессиональный уход и уделить время себе.
            Наш салон работает ежедневно с 10:00 до 20:00.
        </p>

    </section>


    <!-- ADVANTAGES -->

    <section class="advantages">

        <div class="section-title">

            <h2>Почему мы?</h2>

            <p>
                Забота о клиентах — наш главный приоритет
            </p>

        </div>


        <div class="advantages-list">


            <div class="advantage">

                <div class="advantage-icon">
                    ⭐
                </div>

                <h3>Профессионалы</h3>

                <p>
                    Опытные мастера и индивидуальный
                    подход к каждому клиенту.
                </p>

            </div>


            <div class="advantage">

                <div class="advantage-icon">
                    💎
                </div>

                <h3>Качественный сервис</h3>

                <p>
                    Создаём комфортную атмосферу
                    и заботимся о каждой детали.
                </p>

            </div>


            <div class="advantage">

                <div class="advantage-icon">
                    ❤️
                </div>

                <h3>Любовь к своему делу</h3>

                <p>
                    Помогаем нашим клиентам
                    чувствовать себя уверенно.
                </p>

            </div>

        </div>

    </section>


    <!-- CONTACT -->

    <section class="contact" id="contact">

        <h2>Запишитесь к нам</h2>

        <p>
            📞 +7 777 123 45 67
        </p>

        <p>
            📍 Алматы, центр города
        </p>

        <p>
            🕐 Ежедневно: 10:00–20:00
        </p>

        <a href="tel:+77771234567" class="button">
            Позвонить
        </a>

    </section>


    <!-- FOOTER -->

    <footer>

        © 2026 Luxury Beauty

    </footer>

</body>
</html>
